# /etc/nginx/sites-available/afeyfx.conf
# Replace trading.example.com with your domain. Certificates via certbot (Let's Encrypt).

limit_req_zone $binary_remote_addr zone=afx_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=afx_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name trading.example.com;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name trading.example.com;

  ssl_certificate     /etc/letsencrypt/live/trading.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/trading.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  # Security headers for the SPA (the API sets its own via helmet)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://$host; img-src 'self' data: https://avatars.githubusercontent.com https://lh3.googleusercontent.com; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  server_tokens off;
  client_max_body_size 200k;

  # Optional: restrict the whole dashboard to your own IPs / VPN
  # allow 203.0.113.10;
  # deny all;

  root /var/www/afeyfx/client;
  index index.html;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store";
    try_files $uri /index.html;
  }

  location /api/auth/ {
    limit_req zone=afx_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/snippets/afeyfx-proxy.conf;
  }

  # M-Pesa (Daraja) callbacks: the URL carries a secret token, so it is never written to the access log.
  location /api/payments/mpesa/ {
    access_log off;
    limit_req zone=afx_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/snippets/afeyfx-proxy.conf;
  }

  # MT5 terminals (AfeyFX Bridge EA): HMAC-signed requests; heartbeats can carry many deals.
  location /api/bridge/mt5/ {
    client_max_body_size 512k;
    limit_req zone=afx_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/snippets/afeyfx-proxy.conf;
  }

  # Deriv OAuth return: the query string carries a one-time authorization code; keep it out of logs.
  location = /api/brokers/deriv/callback {
    access_log off;
    limit_req zone=afx_auth burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/snippets/afeyfx-proxy.conf;
  }

  location /api/ {
    limit_req zone=afx_api burst=40 nodelay;
    proxy_pass http://127.0.0.1:5000;
    include /etc/nginx/snippets/afeyfx-proxy.conf;
  }

  location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://127.0.0.1:5000;
    access_log off;
  }
}
